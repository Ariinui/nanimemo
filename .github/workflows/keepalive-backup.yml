name: Keepalive + backup Supabase

# Évite la mise en pause du projet Supabase gratuit (inactivité 7 jours)
# et sauvegarde les tables vocab_* en artefact privé (pas dans le repo public).
# Un échec envoie un e-mail GitHub : c'est l'alerte si la base, le stockage d'images
# ou la clé Pixabay ne répondent plus.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub désactive les workflows planifiés après 60 jours sans activité dans le dépôt.
  # Chaque exécution réactive ici les deux workflows par l'API (sans commit), ce qui
  # remet le compteur à zéro. Le second workflow (keepalive-watchdog.yml) fait pareil
  # avec un autre horaire : chacun rattrape l'autre.
  stay-enabled:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Réactiver les workflows planifiés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in keepalive-backup.yml keepalive-watchdog.yml; do
            curl -sS --fail --retry 3 --retry-delay 5 -m 30 -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/enable"
            echo "$wf : réactivé"
          done

  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export des tables
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          mkdir backup
          for t in vocab_sets vocab_cards vocab_progress; do
            curl -sS --fail --retry 3 --retry-delay 5 -m 60 \
              "$URL/rest/v1/$t?select=*&limit=100000" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -o "backup/$t.json"
            echo "$t : $(python3 -c "import json,sys;print(len(json.load(open('backup/$t.json'))))") lignes"
          done
          # Garde-fou : une base vide = alerte (données perdues ou clé invalide)
          python3 -c "import json,sys;sys.exit(0 if len(json.load(open('backup/vocab_sets.json')))>0 else 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: nanimemo-backup-${{ github.run_number }}
          path: backup/
          retention-days: 60

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Clé Pixabay et recherche d'images
        env:
          PIXABAY: ${{ secrets.VITE_PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PIXABAY" || { echo "::error::Secret VITE_PIXABAY_API_KEY absent"; exit 1; }
          curl -sS --fail --retry 3 --retry-delay 5 -m 30             "https://pixabay.com/api/?key=$PIXABAY&q=cat&image_type=photo&per_page=3" -o pixabay.json
          python3 -c "import json,sys;d=json.load(open('pixabay.json'));n=len(d.get('hits',[]));print('Pixabay :',n,'résultats');sys.exit(0 if n>0 else 1)"

      - name: Stockage d'images (écriture, lecture publique, suppression)
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # JPEG 1x1 valide
          echo '/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=' | base64 -d > probe.jpg
          NAME="_healthcheck-${GITHUB_RUN_ID}.jpg"
          curl -sS --fail -m 30 -X POST "$URL/storage/v1/object/card-images/$NAME"             -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: image/jpeg" --data-binary @probe.jpg > /dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$URL/storage/v1/object/public/card-images/$NAME")
          curl -sS -m 30 -X DELETE "$URL/storage/v1/object/card-images/$NAME"             -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null || true
          echo "Lecture publique : $code"
          test "$code" = "200"

      - name: Toutes les images de cartes s'affichent
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 5 -m 60             "$URL/rest/v1/vocab_cards?select=term,image_url&image_url=not.is.null&limit=10000"             -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o cards.json
          python3 - <<'PY'
          import json, subprocess, sys
          cards = json.load(open('cards.json'))
          own = [c for c in cards if '/storage/v1/object/public/card-images/' in c['image_url']]
          external = [c for c in cards if c not in own]
          broken = []
          for c in own:
              r = subprocess.run(['curl', '-s', '-o', '/dev/null', '-m', '30', '-w', '%{http_code} %{content_type}', c['image_url']],
                                 capture_output=True, text=True).stdout.strip()
              if not r.startswith('200 image/'):
                  broken.append((c['term'], r))
          print(f"{len(cards)} cartes avec image : {len(own)} sur notre stockage, {len(external)} externes (à refaire dans l'app)")
          if external:
              print(f"::warning::{len(external)} carte(s) ont encore une image externe (lien temporaire) : ouvre le set > Ajouter les images")
          for term, r in broken:
              print(f"::error::Image absente pour la carte « {term} » : {r}")
          sys.exit(1 if broken else 0)
          PY
