name: Watchdog keepalive

# Second planificateur, indépendant de keepalive-backup.yml : autre horaire, mêmes
# garanties. Il réactive les deux workflows (compteur d'inactivité de 60 jours remis à
# zéro), fait une vraie requête Supabase (anti-pause 7 jours) et alerte par e-mail si le
# workflow principal n'a pas réussi depuis plus de 3 jours.

on:
  schedule:
    - cron: '41 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Réactiver les workflows planifiés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in keepalive-backup.yml keepalive-watchdog.yml; do
            curl -sS --fail --retry 3 --retry-delay 5 -m 30 -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/enable"
            echo "$wf : réactivé"
          done

      - name: Requête Supabase (anti-pause)
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 5 -m 30 \
            "$URL/rest/v1/vocab_sets?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Supabase répond :',len(d),'ligne');sys.exit(0 if len(d)>0 else 1)"

      - name: Le workflow principal a réussi récemment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          last=$(curl -sS --fail -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/keepalive-backup.yml/runs?status=success&per_page=1" \
            | python3 -c "import json,sys;r=json.load(sys.stdin)['workflow_runs'];print(r[0]['created_at'] if r else '')")
          echo "Dernier succès du workflow principal : ${last:-aucun}"
          python3 - "$last" <<'PY'
          import sys, datetime
          s = sys.argv[1]
          if not s:
              print("::error::Aucun succès enregistré du workflow principal"); sys.exit(1)
          age = datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(s.replace('Z', '+00:00'))
          print(f"Ancienneté : {age.days} j")
          if age.days >= 3:
              print(f"::error::Le workflow principal n'a pas réussi depuis {age.days} jours"); sys.exit(1)
          PY
